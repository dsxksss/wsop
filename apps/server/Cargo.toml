[package]
name = "wsop-server"
version = "1.1.1"
description = "wsop 私有化维护客户记录系统 — 中心服务后端"
edition = "2021"

[[bin]]
name = "wsop-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "migrate",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

jsonwebtoken = "9"
argon2 = "0.5"
# Enables `OsRng` (getrandom) for Argon2 salt generation via feature unification.
rand_core = { version = "0.6", features = ["getrandom"] }

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

ts-rs = "10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
mime_guess = "2"
